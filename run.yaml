name: Run OCI Instance Creator
on:
  schedule:
    # Se ejecuta automáticamente cada 3 horas para mantener el intento activo
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  run-bot:
    name: Run Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Lowercase Repository Name
        id: repo
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run OCI Instance Creator
        run: |
          docker run --rm \
            -e OCI_USER_ID="${{ secrets.OCI_USER_ID }}" \
            -e OCI_TENANCY_ID="${{ secrets.OCI_TENANCY_ID }}" \
            -e OCI_SUBNET_ID="${{ secrets.OCI_SUBNET_ID }}" \
            -e OCI_IMAGE_ID="${{ secrets.OCI_IMAGE_ID }}" \
            -e OCI_FINGERPRINT="${{ secrets.OCI_FINGERPRINT }}" \
            -e OCI_REGION="${{ secrets.OCI_REGION }}" \
            -e KEY_PATH="${{ secrets.KEY_PATH }}" \
            -e CPUS="${{ secrets.CPUS }}" \
            -e VOLUME_SIZE="${{ secrets.VOLUME_SIZE }}" \
            -e SHAPE="${{ secrets.SHAPE }}" \
            -e SSH_KEY="${{ secrets.SSH_KEY }}" \
            ghcr.io/${{ env.NAME }}:latest

name: Deploy OCI Instance Creator to Docker

on:
  schedule:
    # Se ejecuta automáticamente cada 5 horas
    - cron: '0 */5 * * *'
  workflow_dispatch:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:

jobs:
  dist:
    name: Build and Run Instance Creator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ env.NAME }}:latest

      - name: Process and Verify OCI Private Key File
        env:
          RAW_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p keys
          
          # Guardar contenido crudo
          echo "$RAW_KEY" > keys/raw.key

          # Caso 1: Ya viene en texto plano PEM sin codificar
          if grep -q "BEGIN" keys/raw.key; then
            echo "La clave está en texto plano PEM."
            cp keys/raw.key keys/temp.key

          # Caso 2: Codificada 1 vez en Base64
          elif echo "$RAW_KEY" | tr -d ' \t\r\n' | base64 --decode 2>/dev/null | grep -q "BEGIN"; then
            echo "La clave tiene 1 nivel de codificación Base64. Decodificando..."
            echo "$RAW_KEY" | tr -d ' \t\r\n' | base64 --decode > keys/temp.key

          # Caso 3: Codificada 2 veces en Base64
          else
            echo "Detectada doble codificación Base64. Decodificando dos veces..."
            echo "$RAW_KEY" | tr -d ' \t\r\n' | base64 --decode | tr -d ' \t\r\n' | base64 --decode > keys/temp.key
          fi

          # Validar y convertir clave a estándar RSA (PKCS#1) de Unix
          openssl rsa -in keys/temp.key -out keys/oci.key
          sed -i 's/\r$//' keys/oci.key
          
          # Limpieza de temporales y permisos
          rm -f keys/raw.key keys/temp.key
          chmod 600 keys/oci.key

      - name: Verify Key File Header
        run: head -n 1 keys/oci.key

      - name: Clean Secrets and Run OCI Instance Creator
        env:
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SUBNET_OCID: ${{ secrets.SUBNET_OCID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_IMAGE_OCID: ${{ secrets.OCI_IMAGE_OCID }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          CPUS: ${{ secrets.CPUS }}
          SHAPE: ${{ secrets.SHAPE }}
          VOLUME_SIZE: ${{ secrets.VOLUME_SIZE }}
          CREATE_INTERVAL_SECONDS: ${{ secrets.CREATE_INTERVAL_SECONDS }}
        run: |
          CLEAN_USER_ID=$(echo "${OCI_USER_ID:-$OCI_USER_OCID}" | tr -d ' \t\r\n')
          CLEAN_TENANCY_ID=$(echo "${OCI_TENANCY_ID:-$OCI_TENANCY_OCID}" | tr -d ' \t\r\n')
          CLEAN_SUBNET_ID=$(echo "${OCI_SUBNET_ID:-$SUBNET_OCID}" | tr -d ' \t\r\n')
          CLEAN_IMAGE_ID=$(echo "${OCI_IMAGE_ID:-$OCI_IMAGE_OCID}" | tr -d ' \t\r\n')
          CLEAN_COMPARTMENT_ID=$(echo "$OCI_COMPARTMENT_OCID" | tr -d ' \t\r\n')
          CLEAN_REGION=$(echo "$OCI_REGION" | tr -d ' \t\r\n')
          CLEAN_FINGERPRINT=$(echo "$OCI_FINGERPRINT" | tr -d ' \t\r\n')
          CLEAN_CPUS=$(echo "$CPUS" | tr -d ' \t\r\n')
          CLEAN_SHAPE=$(echo "$SHAPE" | tr -d ' \t\r\n')
          CLEAN_VOLUME_SIZE=$(echo "$VOLUME_SIZE" | tr -d ' \t\r\n')
          CLEAN_INTERVAL=$(echo "$CREATE_INTERVAL_SECONDS" | tr -d ' \t\r\n')

          docker run --rm \
            -v $(pwd)/keys/oci.key:/keys/oci.key \
            -e OCI_USER_ID="$CLEAN_USER_ID" \
            -e OCI_USER_OCID="$CLEAN_USER_ID" \
            -e OCI_TENANCY_ID="$CLEAN_TENANCY_ID" \
            -e OCI_TENANCY_OCID="$CLEAN_TENANCY_ID" \
            -e OCI_SUBNET_ID="$CLEAN_SUBNET_ID" \
            -e SUBNET_OCID="$CLEAN_SUBNET_ID" \
            -e OCI_IMAGE_ID="$CLEAN_IMAGE_ID" \
            -e OCI_IMAGE_OCID="$CLEAN_IMAGE_ID" \
            -e OCI_COMPARTMENT_ID="$CLEAN_COMPARTMENT_ID" \
            -e OCI_COMPARTMENT_OCID="$CLEAN_COMPARTMENT_ID" \
            -e OCI_REGION="$CLEAN_REGION" \
            -e OCI_FINGERPRINT="$CLEAN_FINGERPRINT" \
            -e SSH_KEY="$SSH_KEY" \
            -e SSH_PUBLIC_KEY="$SSH_PUBLIC_KEY" \
            -e CPUS="$CLEAN_CPUS" \
            -e SHAPE="$CLEAN_SHAPE" \
            -e VOLUME_SIZE="$CLEAN_VOLUME_SIZE" \
            -e CREATE_INTERVAL_SECONDS="$CLEAN_INTERVAL" \
            -e KEY_PATH="/keys/oci.key" \
            ghcr.io/${{ env.NAME }}:latest

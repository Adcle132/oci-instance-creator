name: Deploy OCI Instance Creator to Docker

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:

jobs:
  dist:
    name: Build and Run Instance Creator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64  # Quitado ARM64 para acelerar la compilación 10x
          tags: ghcr.io/${{ env.NAME }}:latest

      - name: Run OCI Instance Creator
        run: |
          docker run --rm \
            -e OCI_USER="${{ secrets.OCI_USER }}" \
            -e OCI_TENANCY="${{ secrets.OCI_TENANCY }}" \
            -e OCI_FINGERPRINT="${{ secrets.OCI_FINGERPRINT }}" \
            -e OCI_REGION="${{ secrets.OCI_REGION }}" \
            ghcr.io/${{ env.NAME }}:latest
